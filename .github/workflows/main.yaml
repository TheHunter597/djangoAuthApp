name: django-auth
on: push

jobs:
  # test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v2
  #     - name: test the application
  #       run: |
  #         docker build -t django-auth-test -f Dockerfile.test .
  #         docker run django-auth-test
  build:
    runs-on: ubuntu-latest
    outputs:
      commit-message: ${{ steps.get_commit_message.outputs.commit-message }}
      version: ${{ steps.get_required_version.outputs.version }}
    steps:
      - uses: actions/checkout@v2
      - name: get commit message
        id: get_commit_message
        run: |
          echo "commit-message=${{ github.event.head_commit.message }}" >> "$GITHUB_OUTPUT"
      - name: get required version
        id: get_required_version
        run: |
          echo "version=$(bash djangoAuthApp/scripts/get-version.sh $commit-message)" >> "$GITHUB_OUTPUT"
          echo $version
