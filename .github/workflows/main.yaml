  #     - name: test the application
  #       run: |
  #         docker build -t django-auth-test -f Dockerfile.test .
  #         docker run django-auth-test
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_required_version.outputs.version }}
    steps:
      - uses: actions/checkout@v2
      - name: get required version
        id: get_required_version
        run: |
          version=$(bash djangoAuthApp/scripts/get-version.sh "${{ github.event.head_commit.message }}")
          echo "version=$version" >> "$GITHUB_ENV"
          echo ${{ github.event.head_commit.message }}
          echo $commit-message
          echo "I am here"
